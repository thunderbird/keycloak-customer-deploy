apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak-customer
resources:
- ../../bases
- keycloak/public-ingress.yaml
- keycloak/tailscale-ingress.yaml
- keycloak/securitygrouppolicy.yaml
- keycloak/admin-client-externalsecret.yaml
configMapGenerator:
- name: keycloak-realm-config
  files:
  - keycloak/realm-config/tbpro-accounts-client.yaml
- name: keycloak-realm-config-scripts
  files:
  - keycloak/realm-config/entry.sh
  - keycloak/realm-config/apply-master-frontendurl.sh
images:
- name: REPLACE_MZLA_ECR/keycloak-customer
  newName: ghcr.io/thunderbird/thunderbird-accounts-keycloak
  digest: sha256:beafa33a00802cba2417e46cfac609a52c99e356bda3ae6e633e1873ab23de34
patches:
- path: keycloak/statefulset.yaml
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: keycloak-customer-db
  patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: mzla/tb-stage/keycloak-customer-db
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: mzla/tb-stage/keycloak-customer-db
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: keycloak-customer-admin
  patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: mzla/tb-stage/keycloak-customer-admin
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: mzla/tb-stage/keycloak-customer-admin
