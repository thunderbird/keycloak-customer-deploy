apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-customer-public
  namespace: keycloak-customer
  labels:
    app.kubernetes.io/name: keycloak-customer
    app.kubernetes.io/component: public-lb
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/create-acm-cert: "true"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/actions.deny-admin: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Forbidden: admin is available on the internal network only."}}
    external-dns.alpha.kubernetes.io/hostname: auth.tb-stage.thunderbird.dev
spec:
  ingressClassName: alb
  rules:
    - host: auth.tb-stage.thunderbird.dev
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: deny-admin
                port:
                  name: use-annotation
          - path: /realms/master
            pathType: Prefix
            backend:
              service:
                name: deny-admin
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-customer
                port:
                  number: 80
