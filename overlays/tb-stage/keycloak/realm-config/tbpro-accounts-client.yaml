realm: tbpro
clients:
  - clientId: thunderbird-accounts
    rootUrl: "https://accounts.stage-thundermail.com"
    baseUrl: "/"
    adminUrl: "https://accounts.stage-thundermail.com"
    redirectUris:
      - "https://accounts.stage-thundermail.com/oidc/callback/*"
      - "https://accounts.stage-thundermail.com/login/"
      - "https://accounts.stage-thundermail.com/logout/callback"
      - "https://accounts-stage-thundermail.tail2726a2.ts.net/oidc/callback/*"
      - "https://accounts-stage-thundermail.tail2726a2.ts.net/login/"
      - "https://accounts-stage-thundermail.tail2726a2.ts.net/logout/callback"
      - "https://accounts-stage.tb.pro/oidc/callback/*"
      - "https://accounts-stage.tb.pro/login/"
    webOrigins:
      - "https://accounts.stage-thundermail.com"
      - "https://accounts-stage-thundermail.tail2726a2.ts.net"
      - "https://accounts-stage.tb.pro"
    attributes:
      "post.logout.redirect.uris": "+"
    protocolMappers:
      - name: is_services_admin
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          "user.attribute": "is_services_admin"
          "claim.name": "is_services_admin"
          "jsonType.label": "String"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
      - &scope_stalwart_audience
        name: stalwart audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: stalwart
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
      - <<: *scope_stalwart_audience
        name: thunderbird-accounts audience
        config:
          included.client.audience: thunderbird-accounts
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
