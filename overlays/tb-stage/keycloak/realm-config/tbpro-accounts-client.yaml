# REPLACE_ME_STALWART_OIDC_CLIENT: add a Stalwart client here if platform-infrastructure#1394 finds one is needed.
realm: tbpro
clients:
  - clientId: thunderbird-accounts
    rootUrl: "https://accounts.tb-stage.thunderbird.dev"
    baseUrl: "/"
    adminUrl: "https://accounts.tb-stage.thunderbird.dev"
    redirectUris:
      - "https://accounts.tb-stage.thunderbird.dev/oidc/callback/*"
      - "https://accounts.tb-stage.thunderbird.dev/login/"
      - "https://accounts.tb-stage.thunderbird.dev/logout/callback"
      - "https://accounts-tb-stage.tail2726a2.ts.net/oidc/callback/*"
      - "https://accounts-tb-stage.tail2726a2.ts.net/login/"
      - "https://accounts-tb-stage.tail2726a2.ts.net/logout/callback"
      - "https://accounts-stage.tb.pro/oidc/callback/*"
      - "https://accounts-stage.tb.pro/login/"
    webOrigins:
      - "https://accounts.tb-stage.thunderbird.dev"
      - "https://accounts-tb-stage.tail2726a2.ts.net"
      - "accounts-stage.tb.pro"
    attributes:
      "post.logout.redirect.uris": "+"
    protocolMappers:
      - name: is_services_admin
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          "user.attribute": "is_services_admin"
          "claim.name": "is_services_admin"
          "jsonType.label": "String"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
