apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-stage-thundermail
  namespace: keycloak-customer
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - auth-stage-thundermail
  defaultBackend:
    service:
      name: keycloak-customer
      port:
        number: 80
