# Tailnet Ingress for the whole tb-prod Customer Auth Keycloak service. Public auth
# is the ALB in public-ingress.yaml, which denies /admin and /realms/master; the
# admin console host is tailscale-admin-ingress.yaml.
#
# Operator appends .<TAILNET>.ts.net -> keycloak-customer-tb-prod.tail2726a2.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-customer-tb-prod
  namespace: keycloak-customer
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - keycloak-customer-tb-prod
  defaultBackend:
    service:
      name: keycloak-customer
      port:
        number: 80
