# tb-prod patch: KC_HOSTNAME=https://auth.tb.pro, the tailnet KC_HOSTNAME_ADMIN
# and the legacy Keycloak database.
#
# DIRECT Neon endpoint (not -pooler) so Liquibase isn't on PgBouncer; sslmode=require
# (Neon needs TLS). Creds come from the keycloak-customer-db ExternalSecret
# (mzla/tb-prod/*).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-customer
  namespace: keycloak-customer
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: keycloak
          resources:
            requests:
              cpu: 500m
          env:
            - name: KC_HOSTNAME
              value: https://auth.tb.pro
            - name: KC_HOSTNAME_ADMIN
              value: https://keycloak-customer-admin.tail2726a2.ts.net
            - name: KC_DB_URL_HOST
              value: REPLACE_ME_LEGACY_KEYCLOAK_DB_HOST
            - name: KC_DB_URL_PROPERTIES
              value: "?sslmode=require"
            - name: KC_SPI_THEME_WELCOME_THEME
              value: tbpro
            - name: KC_TBPRO_PRIMARY_DOMAIN
              value: thundermail.com
            - name: KC_TBPRO_HOME
              value: https://accounts.tb.pro/
            - name: KC_TBPRO_SIGN_UP
              value: https://accounts.tb.pro/sign-up
            - name: KC_TBPRO_CONTACT
              value: https://accounts.tb.pro/contact
            - name: KC_SPI_REALM_RESTAPI_EXTENSION_MFA_AUTHORIZED_CLIENTS
              value: thunderbird-accounts
            - name: KC_SPI_REALM_RESTAPI_EXTENSION_MFA_STEP_UP_ACR
              value: "2"
            - name: KC_SPI_REALM_RESTAPI_EXTENSION_MFA_STEP_UP_MAX_AGE_SECONDS
              value: "600"
            - name: MFA_L1_LOA_MAX_AGE
              value: "7776000"
            - name: KC_SPI_LOGIN_PROTOCOL__OPENID_CONNECT__ALLOW_TOKEN_INTROSPECTION_WITHOUT_AUDIENCE_CHECK
              value: "true"
            - name: TBPRO_MAIL_GATE
              value: CONDITIONAL
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: tb-accounts-admin
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-customer-admin-client
                  key: client-secret
