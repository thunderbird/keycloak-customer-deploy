apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak-customer
# The ALB in keycloak/public-ingress.yaml replaces the Cloudflare tunnel
# (keycloak/cloudflare-tunnel.yaml, keycloak/cloudflare-externalsecret.yaml);
# those files and the 3-replica / minAvailable-2 PDB patch (keycloak/pdb.yaml)
# stay unreferenced.
resources:
- ../../bases
- keycloak/public-ingress.yaml
- keycloak/tailscale-ingress.yaml
- keycloak/tailscale-admin-ingress.yaml
- keycloak/securitygrouppolicy.yaml
- keycloak/admin-client-externalsecret.yaml
- keycloak/master-frontendurl-job.yaml
images:
- name: REPLACE_MZLA_ECR/keycloak-customer
  newName: ghcr.io/thunderbird/thunderbird-accounts-keycloak
  digest: sha256:792d59b7bfd0f7c019cb45723b36fa660713d13a28c67e730e32a1589c8895dd
patches:
# Keycloak workload: public and admin hostnames, legacy DB host, admin client
- path: keycloak/statefulset.yaml
# ExternalSecret remoteRef keys -> mzla/tb-prod/*
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: keycloak-customer-db
  patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: mzla/tb-prod/keycloak-customer-db
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: mzla/tb-prod/keycloak-customer-db
    - op: add
      path: /spec/data/-
      value:
        secretKey: host
        remoteRef:
          key: mzla/tb-prod/keycloak-customer-db
          property: host
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: keycloak-customer-admin
  patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: mzla/tb-prod/keycloak-customer-admin
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: mzla/tb-prod/keycloak-customer-admin
# The master frontendUrl Job follows the StatefulSet.
replacements:
- source:
    kind: StatefulSet
    name: keycloak-customer
    fieldPath: spec.template.spec.containers.[name=keycloak].env.[name=KC_HOSTNAME_ADMIN].value
  targets:
  - select:
      kind: Job
      name: keycloak-master-frontendurl
    fieldPaths:
    - spec.template.spec.containers.[name=kcadm].env.[name=FRONTEND_URL].value
- source:
    kind: StatefulSet
    name: keycloak-customer
    fieldPath: spec.template.spec.containers.[name=keycloak].env.[name=KEYCLOAK_ADMIN_CLIENT_ID].value
  targets:
  - select:
      kind: Job
      name: keycloak-master-frontendurl
    fieldPaths:
    - spec.template.spec.containers.[name=kcadm].env.[name=CLIENT_ID].value
- source:
    kind: StatefulSet
    name: keycloak-customer
    fieldPath: spec.replicas
  targets:
  - select:
      kind: Job
      name: keycloak-master-frontendurl
    fieldPaths:
    - spec.template.spec.containers.[name=kcadm].env.[name=REPLICAS].value
