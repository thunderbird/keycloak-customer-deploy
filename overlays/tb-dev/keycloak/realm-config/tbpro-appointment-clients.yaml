realm: tbpro
clients:
  - clientId: thunderbird-appointment-frontend
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    rootUrl: "https://appointment.main.dev-thundermail.com"
    redirectUris:
      - "https://appointment.tb-dev.thunderbird.dev/*"
      - "https://appointment.main.dev-thundermail.com/*"
    webOrigins:
      - "https://appointment.tb-dev.thunderbird.dev"
      - "https://appointment.main.dev-thundermail.com"
    attributes:
      "post.logout.redirect.uris": "+"
      "pkce.code.challenge.method": "S256"
    # Same mapper as thunderbird-accounts keycloak/config-cli/tbpro-aud-mapper.yaml, which this overlay does not run.
    protocolMappers:
      - name: appointment backend audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: thunderbird-appointment-backend
          id.token.claim: "false"
          lightweight.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"

  - clientId: thunderbird-appointment-backend
    enabled: true
    publicClient: false
    standardFlowEnabled: false
    redirectUris: []
