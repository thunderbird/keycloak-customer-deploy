# Customer Auth Keycloak (realm tbpro) - HA StatefulSet.
#
# IMAGE: custom image with the baked-in tbpro Vue/Tailwind theme, mirrored into
# an mzla-owned ECR (issue thunderbird/platform-infrastructure#531). NOT stock
# quay.io/keycloak. The `images:` transform in each overlay sets newName + newTag;
# the string before ":" here is the match key.
#
# REALM: tbpro realm data lives in the SHARED Neon database (source ECS and the
# EKS target use the same DB), so there is no --import-realm and no data migration
# -- the cutover is a traffic flip. Validation runs against isolated Neon branches.
# The custom JWT claim mappers, clients, and theme live in the DB + image.
#
# HOSTNAME/EXPOSURE: KC_HOSTNAME is patched per overlay. Admin access is via
# Tailscale (overlay-managed Ingress); dev + prod are tailnet-only today. At the
# prod cutover (#142) tb-prod adds the public Cloudflare tunnel + KC_HOSTNAME_ADMIN.
#
# SCHEDULING: the general arm64 node group (no dedicated keycloak nodes). The
# custom image must be multi-arch or arm64.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-customer
  namespace: keycloak-customer
  labels:
    app.kubernetes.io/name: keycloak-customer
    app.kubernetes.io/instance: keycloak-customer-auth
spec:
  serviceName: keycloak-customer-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-customer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-customer
        app.kubernetes.io/instance: keycloak-customer-auth
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: general
        # Image is arm64 (mirrored multi-arch); pin arch so it never lands on an
        # amd64 node if a mixed pool is ever introduced.
        kubernetes.io/arch: arm64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-customer
      containers:
        - name: keycloak
          image: REPLACE_MZLA_ECR/keycloak-customer:REPLACE_MIRRORED_SHA
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - start
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: jgroups
              containerPort: 7800
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            # Database
            - name: KC_DB
              value: postgres
            # Shared Neon over PrivateLink. DB host is set per-overlay (each env's
            # Neon endpoint); the overlay also adds KC_DB_URL_PROPERTIES=?sslmode=require.
            - name: KC_DB_URL_HOST
              value: REPLACE_OVERLAY_KC_DB_HOST
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-customer-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-customer-db
                  key: password
            # Bootstrap admin credentials
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-customer-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-customer-admin
                  key: password
            # Hostname/proxy. KC_HOSTNAME is patched per overlay (tailnet URL for
            # tb-dev; auth.tb.pro for tb-prod). Plaintext HTTP behind the
            # tunnel/ingress; TLS terminates upstream.
            - name: KC_HOSTNAME
              value: REPLACE_OVERLAY_KC_HOSTNAME
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            # Clustering: Infinispan with JGroups JDBC_PING discovery (Keycloak's default
            # from 26.0 onward -- reached by leaving KC_CACHE_STACK UNSET).
            #
            # This replaced KC_CACHE_STACK=kubernetes + -Djgroups.dns.query=<headless svc>,
            # i.e. DNS_PING, which Keycloak 26.5.7 deprecates on every startup:
            #   "cache-stack=kubernetes: Use 'jdbc-ping' instead by leaving it unset."
            #
            # JDBC_PING discovers peers through a JGROUPSPING table in Keycloak's own
            # database (Keycloak creates and maintains it), so discovery no longer depends
            # on headless-Service DNS. The headless Service is still required for the
            # StatefulSet's stable pod DNS -- do not delete it.
            #
            # *** THIS IS A DISCOVERY PROTOCOL CHANGE, NOT A FLAG RENAME. *** During a
            # ROLLING restart the old pods still speak DNS_PING and the new ones speak
            # JDBC_PING, so they cannot see each other: you get two single-member clusters
            # and the ispn caches (sessions, authenticationSessions, actionTokens) split.
            # The practical symptom is users being logged out, and -- as seen on tb-dev
            # 2026-08-18 -- a window where a replica is Ready but cannot authenticate,
            # which fails LOGIN with userId="null" / invalid_user_credentials.
            #
            # Roll it out per environment accordingly:
            #   tb-dev  -- a rolling restart is acceptable; sessions there are disposable.
            #   tb-prod -- SCALE TO ZERO, then back up, inside a maintenance window. Do NOT
            #              rolling-restart, and do NOT combine this with an image bump.
            - name: KC_CACHE
              value: ispn
            - name: JAVA_OPTS_APPEND
              value: >-
                -Xms1g -Xmx1536m
            # Health and metrics
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-data
          emptyDir:
            sizeLimit: 1Gi
